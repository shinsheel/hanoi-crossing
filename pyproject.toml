[project]
name = "hanoi-crossing"
version = "0.1.0"
description = "Hanoi Crossing game engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
hanoi-crossing = "hanoi_crossing.main:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
